name: Sync competition reference
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-competition
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read private competition repository
        env:
          COMPETITION_READ_KEY: ${{ secrets.COMPETITION_READ_KEY }}
        run: python scripts/ci_submodule.py
      - name: Fetch selected competition branch
        run: python scripts/model_ref.py update
      - name: Check source reference and mock contract before opening PR
        run: |
          python scripts/check_repository.py
          python scripts/smoke.py
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/competition
          base: main
          add-paths: |
            vendor/competition
            model.lock.json
          commit-message: 'chore: update competition reference'
          title: 'chore: 更新比赛模型代码引用'
          body: |
            跟踪 .gitmodules 当前分支，更新比赛子模块固定提交和 model.lock.json。
            本工作流已通过引用完整性和产品 mock HTTP 契约检查。
            请 A/B 核对真实推理入口、权重、环境及效果后合并；未自动运行 GPU 推理。
            默认 GITHUB_TOKEN 创建的 PR 不会触发后续工作流，本工作流已先运行相同 CPU 检查。
