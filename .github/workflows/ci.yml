name: Product checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read private competition repository
        env:
          COMPETITION_READ_KEY: ${{ secrets.COMPETITION_READ_KEY }}
        run: python scripts/ci_submodule.py
      - run: python scripts/check_repository.py
      - name: Install CPU media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements-dev.txt
      - run: python scripts/smoke.py
      - run: python -m unittest discover -s tests -v
